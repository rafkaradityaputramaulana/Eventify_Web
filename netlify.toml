[build]
  command = "npm run build"
  publish = "dist"

# 1. Reverse Proxy ke API VPS via Cloudflare Tunnel (HTTPS)
[[redirects]]
  from = "/api/v1/*"
  to = "https://photograph-revision-tell-lynn.trycloudflare.com/api/v1"
  status = 200
  force = true

# 2. Routing fallback untuk React Router (Single Page Application / SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200